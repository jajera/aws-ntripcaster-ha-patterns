<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img"
     aria-label="Two HA paths: in-region L4 NLB and cross-region DNS failover">
  <title>aws-ntripcaster-ha-patterns</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132025"/>
      <stop offset="1" stop-color="#0b1316"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#2a3b42" stroke-width="12"/>

  <!-- dual-AZ L4: fan-in to shared NLB -->
  <g stroke="#2dd4bf" stroke-width="40" stroke-linecap="round" fill="none">
    <path d="M120 170 L256 230"/>
    <path d="M392 170 L256 230"/>
    <line x1="256" y1="230" x2="256" y2="300"/>
  </g>
  <circle cx="256" cy="320" r="28" fill="#2dd4bf"/>

  <!-- multi-region DNS: PRIMARY / SECONDARY -->
  <g stroke="#fbbf24" stroke-width="40" stroke-linecap="round" fill="none">
    <line x1="160" y1="400" x2="240" y2="400"/>
    <line x1="272" y1="400" x2="352" y2="400"/>
  </g>
  <circle cx="140" cy="400" r="22" fill="#fbbf24"/>
  <circle cx="372" cy="400" r="22" fill="#fbbf24" fill-opacity="0.55"/>
</svg>
