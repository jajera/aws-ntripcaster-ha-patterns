<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="NTRIP caster HA patterns — L4 in-region and DNS across regions">
  <title>NTRIP caster HA patterns</title>
  <defs>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.55" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.92" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16242a"/>
      <stop offset="1" stop-color="#0d1518"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b1216"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>
  <rect width="1200" height="8" fill="url(#topbar)"/>

  <!-- mark -->
  <g transform="translate(80 60) scale(0.1094)">
    <rect width="512" height="512" rx="112" fill="url(#tile)"/>
    <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#2a3b42" stroke-width="12"/>
    <g stroke="#2dd4bf" stroke-width="40" stroke-linecap="round" fill="none">
      <path d="M120 170 L256 230"/>
      <path d="M392 170 L256 230"/>
      <line x1="256" y1="230" x2="256" y2="300"/>
    </g>
    <circle cx="256" cy="320" r="28" fill="#2dd4bf"/>
    <g stroke="#fbbf24" stroke-width="40" stroke-linecap="round" fill="none">
      <line x1="160" y1="400" x2="240" y2="400"/>
      <line x1="272" y1="400" x2="352" y2="400"/>
    </g>
    <circle cx="140" cy="400" r="22" fill="#fbbf24"/>
    <circle cx="372" cy="400" r="22" fill="#fbbf24" fill-opacity="0.55"/>
  </g>

  <text x="156" y="97" font-family="Noto Sans Mono, Liberation Mono, monospace" font-size="23"
        letter-spacing="1.5" fill="#2dd4bf">jajera / aws-ntripcaster-ha-patterns</text>
  <text x="1120" y="97" text-anchor="end" font-family="Noto Sans Mono, Liberation Mono, monospace"
        font-size="18" fill="#6f8a91">aws-ntripcaster-ha-patterns.johna.kiwi</text>

  <g font-family="Montserrat, Sora, Noto Sans, sans-serif" font-weight="700" font-size="72"
     letter-spacing="-1.5" fill="#eef5f3">
    <text x="80" y="240">NTRIP caster</text>
    <text x="80" y="322">HA patterns</text>
  </g>

  <text x="80" y="380" font-family="Noto Sans, sans-serif" font-size="28" fill="#a7bdb8">
    Dual-AZ L4 NLB in-region · Route53 DNS across regions.
  </text>

  <rect x="80" y="418" width="1040" height="148" rx="20" fill="#111d21" stroke="#24343a" stroke-width="2"/>

  <g>
    <rect x="108" y="453" width="164" height="36" rx="10" fill="#2dd4bf" fill-opacity="0.16"/>
    <text x="190" y="478" text-anchor="middle" font-family="Montserrat, Noto Sans, sans-serif"
          font-weight="600" font-size="19" fill="#2dd4bf">Dual-AZ L4</text>
    <g stroke="#2dd4bf" stroke-width="6" stroke-linecap="round">
      <line x1="316" y1="471" x2="612" y2="471"/>
    </g>
    <circle cx="308" cy="471" r="10" fill="#2dd4bf"/>
    <circle cx="620" cy="471" r="10" fill="#2dd4bf"/>
    <text x="656" y="478" font-family="Noto Sans, sans-serif" font-size="20" fill="#c5d4d0">
      shared NLB · ~20–40s gap
    </text>
  </g>

  <g>
    <rect x="108" y="513" width="164" height="36" rx="10" fill="#fbbf24" fill-opacity="0.16"/>
    <text x="190" y="538" text-anchor="middle" font-family="Montserrat, Noto Sans, sans-serif"
          font-weight="600" font-size="19" fill="#fbbf24">Multi-region</text>
    <g stroke="#fbbf24" stroke-width="6" stroke-linecap="round">
      <line x1="316" y1="531" x2="424" y2="531"/>
      <line x1="504" y1="531" x2="612" y2="531"/>
    </g>
    <circle cx="308" cy="531" r="10" fill="#fbbf24"/>
    <circle cx="620" cy="531" r="10" fill="#fbbf24"/>
    <rect x="446" y="513" width="36" height="36" rx="6" fill="#fbbf24" transform="rotate(45 464 531)"/>
    <text x="656" y="538" font-family="Noto Sans, sans-serif" font-size="20" fill="#c5d4d0">
      Route53 failover · 1–3+ min
    </text>
  </g>
</svg>
